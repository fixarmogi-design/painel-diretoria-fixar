<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento por Base — Fixar Soluções</title>
<style>
/* ============================== TOKENS (mesma linguagem do dashboard interno) ============================== */
:root{
  --r:10px; --r-sm:6px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t:.16s cubic-bezier(.4,0,.2,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --surface-3:#2c2c2a;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.16);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
  --marca:#C2231D; --marca-esc:#76180E; --marca-ink:#F0F0EE;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1f1ee; --surface:#fcfcfb; --surface-2:#f4f4f1; --surface-3:#e9e8e3;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#797771;
  --grid:#e1e0d9; --border:rgba(11,11,11,.12); --border-2:rgba(11,11,11,.20);
  --good:#0a8a0a; --warn:#b47c00; --serious:#c9603a; --crit:#c22f2f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.10);
  --marca:#C2231D; --marca-esc:#76180E; --marca-ink:#3C3C3A;
  --shadow:0 1px 2px rgba(11,11,11,.06), 0 6px 20px rgba(11,11,11,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================== TOPO ============================== */
.topbar{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 20px;height:64px}
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--marca-esc),var(--marca) 55%,var(--marca-esc))}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none;
  overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand-txt{line-height:1.25}
.brand-txt b{font-size:14.5px;font-weight:800;letter-spacing:.2px;display:block}
.brand-txt span{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.top-right{margin-left:auto;text-align:right;font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.top-right b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;text-transform:none;font-weight:800;margin-top:2px}

/* ============================== LAYOUT ============================== */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.page-h{margin-bottom:14px}
.page-h h1{font-size:19px;font-weight:800;letter-spacing:-.2px;margin:0}
.page-h p{margin:4px 0 0;font-size:11.5px;color:var(--muted)}

/* ============================== CARDS ============================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.card-t{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}
.card-s{font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.card-b{padding:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.kpi{display:flex;align-items:center;gap:11px;padding:13px}
.kpi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:18px;height:18px}
.kpi-l{font-size:9.5px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase;line-height:1.2}
.kpi-v{font-size:21px;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin-top:1px}

.hbar{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;margin-bottom:10px}
.hbar-n{font-size:10.5px;font-weight:700;letter-spacing:.3px}
.hbar-v{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.hbar-tr{display:block;grid-column:1/-1;height:10px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hbar-fl{display:block;height:100%;min-width:2px;border-radius:0 4px 4px 0;transition:width .5s cubic-bezier(.4,0,.2,1)}

.mini{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.mini:last-child{border-bottom:0}
.mini-l{font-size:11px;color:var(--ink-2);line-height:1.5}
.mini-v{font-size:10.5px;color:var(--muted);white-space:nowrap;flex:none}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;
  background:var(--tg-bg);color:var(--tg);border:1px solid var(--tg-bd)}
.tag i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;font-style:normal}

.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
thead th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px 10px;
  font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th .ar{opacity:.55;font-size:8px;margin-left:3px}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:10px}
.field{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 9px;height:31px}
.field svg{width:13px;height:13px;color:var(--muted);flex:none}
.field input,.field select{background:none;border:0;outline:0;font-size:11.5px;height:100%;min-width:80px}
.field input::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 11px;height:31px;cursor:pointer;font-size:11px;font-weight:600;
  letter-spacing:.4px;transition:var(--t);white-space:nowrap;color:var(--ink-2)}
.btn:hover{background:var(--surface-2);border-color:var(--border-2);color:var(--ink)}
.btn svg{width:13px;height:13px}

.warnbox{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.warnbox .card-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.vazio{padding:22px;text-align:center;color:var(--muted);font-size:11px}
.footnote{margin-top:16px;font-size:10px;color:var(--muted);text-align:center;letter-spacing:.3px}
.footnote b{color:var(--ink-2)}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--ink-2);transition:var(--t)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:hover:not(.active){background:var(--surface-2);color:var(--ink)}

.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duas h2{font-size:12.5px;font-weight:800;letter-spacing:.4px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
@media (max-width:760px){ .duas{grid-template-columns:1fr} }

@media (max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} }

/* ============================== MÊS A MÊS POR BASE ============================== */
.mat td[data-m],.mat td[data-b],.mat th[data-b],.mat td[data-limpar]{cursor:pointer}
.mat td[data-m]:hover,.mat td[data-b]:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.mat td.mes{font-weight:700}
.mat td.tot{font-weight:800}
.mat tbody tr:hover{background:transparent}
.mat tr.ref td{background:var(--accent-soft)}
.mat tr.fim td{font-weight:800;border-top:2px solid var(--border-2);background:var(--surface-2)}
.mat tr.fim-media td{background:color-mix(in srgb,var(--s2) 18%,var(--surface-2))}
.mat .nota-inline{font-weight:400;font-size:9px;color:var(--muted);letter-spacing:.2px;text-transform:none;margin-left:6px;white-space:nowrap}
.mat .ar{font-size:8px;opacity:.6;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.btn.seg.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .sp{flex:1}
.top-right small{display:block;margin-top:3px;font-size:10px;font-weight:400;letter-spacing:.3px;opacity:.65}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.mat th.grp{text-align:center;border-bottom:1px solid var(--border)}
.mat-nota{padding:7px 13px;font-size:10px;color:var(--muted);border-top:1px solid var(--border)}
</style>
</head>

  const vazio = t => `<div class="vazio">${esc(t)}</div>`;

  const I = {
    fechamento: '<path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>',
    alertas: '<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0zM12 9v4M12 17h.01"/>',
    relatorios: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M8 13h8M8 17h5"/>',
    producao: '<path d="M2 20h20V9l-6 4V9l-6 4V3H6l-4 6z"/>',
    equipes: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
  };

  /* ------------------------------------------------------------ dados */
  let MED = [], PRO = [];
  let ABA_ATIVA = 'medidores';
  const filtro = { q: '', base: '', mes: '', periodo: '30d', ord: 'data', dir: -1 };
  const filtroP = { q: '', base: '', mes: '', periodo: '30d', produto: '', ord: 'data', dir: -1 };

  /* Nome antigo do produto: linhas já gravadas como CAIXA TANQUINHO aparecem como BLINDAGEM,
     sem precisar mexer na planilha (e as duas grafias nunca viram dois produtos). */
  const PRODUTOS_ANTIGOS = { 'caixa tanquinho': 'BLINDAGEM' };
  const produtoCanon = p => { const s = String(p || '').trim(); return PRODUTOS_ANTIGOS[norm(s)] || s.toUpperCase(); };

  function prepFechamento(rows) {
    rows.forEach(f => {
      f._d = toDate(f.data); f._k = key(f._d); f._q = num(f.quantidade); f._meta = num(f.meta);
      f._equipes = num(f.equipes);
      f._base = String(f.base || '').toUpperCase().trim();
      f._motivo = String(f.motivo || '').trim();
      f._produto = produtoCanon(f.produto);
    });
    return rows;
  }

  function carregar() {
    let emb = {};
    try { emb = JSON.parse($('#dados-embutidos').textContent.trim() || '{}'); } catch (e) { emb = {}; }
    MED = prepFechamento(parseCSV(emb.fechamento_bases || ''));
    PRO = prepFechamento(parseCSV(emb.fechamento_producao || ''));
    MED.push(...prepFechamento(EXTRA.med.map(r => ({ ...r }))));    // + o que foi importado de arquivo nesta tela
    PRO.push(...prepFechamento(EXTRA.pro.map(r => ({ ...r }))));
  }

  /* ------------------------------------------------------------ importar / baixar CSV */
  /* Linhas vindas de arquivo só existem nesta tela: não vão para a planilha e somem ao recarregar. */
  const EXTRA = { med: [], pro: [] };
  let RELATORIO_IMPORT = [];
  let EXPORTAR = null;   // o que o botão "Baixar CSV" leva: { arquivo, cab, dados }

  const chaveLinha = f => `${key(toDate(f.data))}|${norm(f.base)}|${norm(produtoCanon(f.produto))}`;
  const LINHA_VAZIA = { data: '', hora: '', base: '', produto: '', equipes: '', meta: '', quantidade: '', motivo: '', observacao: '', gerente: '' };

  function lerCsvImportado(nome, texto) {
    const rows = parseCSV(texto);
    if (!rows.length) return { nome, texto: 'arquivo vazio — nada importado', erro: true };
    const cols = Object.keys(rows[0]);
    if (!['data', 'base', 'quantidade'].every(c => cols.includes(c)))
      return { nome, texto: 'não reconheci as colunas (preciso de data, base e quantidade) — nada importado', erro: true };
    const pro = cols.includes('produto');                       // com "produto" = Blindagem; sem = Medidores
    const alvo = pro ? EXTRA.pro : EXTRA.med;
    const existentes = new Set([...(pro ? PRO : MED), ...alvo].map(chaveLinha));   // mesmo dia + base (+ produto) = já existe
    const entram = []; let repetidas = 0, invalidas = 0;
    rows.forEach(r => {
      if (!toDate(r.data) || !String(r.base || '').trim()) { invalidas++; return; }
      if (existentes.has(chaveLinha(r))) { repetidas++; return; }
      entram.push({ ...LINHA_VAZIA, ...r, base: String(r.base).trim() });
    });
    alvo.push(...entram);
    const partes = [`${n0(entram.length)} nova(s)`];
    if (repetidas) partes.push(`${n0(repetidas)} já estavam no painel`);
    if (invalidas) partes.push(`${n0(invalidas)} sem data ou base`);
    return { nome, texto: `${pro ? 'Blindagem' : 'Medidores'}: ${partes.join(' · ')}` };
  }

  function decodificar(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }   // o Excel em português salva assim
  }

  function importarArquivos(files) {
    const lista = [...files].filter(f => /\.(csv|txt)$/i.test(f.name));
    if (!lista.length) {
      RELATORIO_IMPORT = [{ nome: 'Importar CSV', texto: 'escolha arquivos .csv (no Excel: Salvar como → CSV)', erro: true }];
      renderAvisoImport(); return;
    }
    const relatorio = new Array(lista.length); let pend = lista.length;
    const fim = () => { if (--pend === 0) { RELATORIO_IMPORT = relatorio; render(); } };
    lista.forEach((f, i) => {
      const r = new FileReader();
      r.onload = () => { try { relatorio[i] = lerCsvImportado(f.name, decodificar(r.result)); } catch (e) { relatorio[i] = { nome: f.name, texto: 'não consegui ler este arquivo', erro: true }; } fim(); };
      r.onerror = () => { relatorio[i] = { nome: f.name, texto: 'não consegui abrir este arquivo', erro: true }; fim(); };
      r.readAsArrayBuffer(f);
    });
  }

  function renderAvisoImport() {
    const box = $('#avisoImport');
    const temDados = EXTRA.med.length || EXTRA.pro.length;
    if (!temDados && !RELATORIO_IMPORT.length) { box.innerHTML = ''; return; }
    const linhas = RELATORIO_IMPORT.map(r => `<div class="mini"><span class="mini-l">${esc(r.nome)}</span><span class="mini-v" style="font-weight:600;white-space:normal;text-align:right;color:${r.erro ? 'var(--crit)' : 'var(--ink)'}">${esc(r.texto)}</span></div>`).join('');
    box.innerHTML = `<div class="card" style="margin-bottom:12px;border-left:3px solid var(--s1)"><div class="card-b">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
        <div><b>📥 Dados importados de arquivo</b> <span style="color:var(--muted)">${temDados ? `— Medidores: ${n0(EXTRA.med.length)} · Blindagem: ${n0(EXTRA.pro.length)} linha(s). Só aparecem nesta tela; não foram para a planilha.` : ''}</span></div>
        <button class="btn" id="limparImport">${temDados ? 'Remover importados' : 'Fechar'}</button></div>${linhas}</div></div>`;
    $('#limparImport').onclick = () => { EXTRA.med = []; EXTRA.pro = []; RELATORIO_IMPORT = []; render(); };
  }

  function csvTexto(cab, dados) {
    const cel = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [cab, ...dados].map(l => l.map(cel).join(';')).join('\r\n') + '\r\n';
  }
  function baixarVista() {
    if (!EXPORTAR) return;
    const blob = new Blob(['\uFEFF' + csvTexto(EXPORTAR.cab, EXPORTAR.dados)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${EXPORTAR.arquivo}-${key(new Date())}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }


  const cores = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];

  function refGeral() {
    let ref = null;
    [...MED, ...PRO].forEach(x => { if (x._d && (!ref || x._d > ref)) ref = x._d; });
    if (!ref) ref = new Date();
    ref.setHours(0, 0, 0, 0);
    return ref;
  }

  /* --------------------------------------------- mês a mês por base */
  /* bases que já não operam: ficam no histórico, mas nunca contam como "sem lançar hoje" */
  const BASES_ENCERRADAS = ['LIGHT'];
  const encerrada = b => BASES_ENCERRADAS.includes(String(b || '').toUpperCase().trim());
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const ym = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : '';
  const rotMes = k => { const [y, m] = k.split('-'); return `${MESES[+m - 1]}/${y}`; };
  let modoGeral = 'hoje';   // visão geral: 'hoje' | 'mes'
  let baseGeral = '';       // visão geral, mês a mês: filtro de base ('' = todas)
  let modoMes = 'qtd';   // 'qtd' = soma das quantidades · 'lanc' = nº de lançamentos

  /* todos os meses entre o primeiro e o último lançamento (mês sem dado aparece vazio) */
  function listaMeses(rows) {
    const ds = rows.map(f => f._d).filter(Boolean);
    if (!ds.length) return [];
    let ini = ds[0], fim = ds[0];
    ds.forEach(d => { if (d < ini) ini = d; if (d > fim) fim = d; });
    const out = [];
    let y = ini.getFullYear(), m = ini.getMonth() + 1;
    const yf = fim.getFullYear(), mf = fim.getMonth() + 1;
    while (y < yf || (y === yf && m <= mf)) {
      out.push(`${y}-${String(m).padStart(2, '0')}`);
      if (++m > 12) { m = 1; y++; }
    }
    return out;
  }

  function matrizMeses(rows, bases, meses, ref, cfg, corBase, filtroBase) {
    if (!meses.length) return { tabela: '', chart: '' };
    const cel = new Map();
    rows.forEach(f => {
      if (!f._d) return;
      const k = ym(f._d) + '|' + f._base;
      const c = cel.get(k) || { q: 0, n: 0, e: 0 };
      c.q += f._q; c.n += 1; c.e += f._equipes || 0; cel.set(k, c);
    });
    const get = (m, b) => cel.get(m + '|' + b) || { q: 0, n: 0, e: 0 };
    const somaCels = lista => lista.reduce((s, c) => ({ q: s.q + c.q, e: s.e + c.e, n: s.n + c.n }), { q: 0, e: 0, n: 0 });
    /* 'media' = quantidade dividida pela soma de equipes daquele agrupamento — sempre soma antes de
       dividir (nunca é a média das médias mensais), senão um mês com pouco movimento pesa igual a
       um mês cheio. Sem nenhuma equipe registrada no agrupamento, devolve null (vira traço). */
    const valorDe = a => modoMes === 'qtd' ? a.q : modoMes === 'eq' ? a.e : modoMes === 'lanc' ? a.n : (a.e > 0 ? a.q / a.e : null);
    const val = (m, b) => valorDe(get(m, b));

    const ordem = [...bases.filter(b => !encerrada(b)), ...bases.filter(encerrada)];
    const maxCol = new Map(ordem.map(b => [b, Math.max(0, ...meses.map(m => val(m, b) || 0))]));
    const totBase = new Map(ordem.map(b => [b, valorDe(somaCels(meses.map(m => get(m, b))))]));
    const totGeral = valorDe(somaCels(ordem.flatMap(b => meses.map(m => get(m, b)))));
    const refM = ym(ref);
    const traco = '<span style="color:var(--muted)">—</span>';
    const btn = (id, txt) => `<button class="btn seg ${modoMes === id ? 'on' : ''}" data-modo="${id}">${esc(txt)}</button>`;
    const fmt = v => v == null ? traco : (modoMes === 'media' ? n1(v) : (v ? n0(v) : traco));

    const cabecalho = ordem.map(b => `<th class="num" data-b="${esc(b)}" title="ver os lançamentos de ${esc(b)}">${esc(b)}${encerrada(b) ? '<span class="ar"> encerrada</span>' : ''}</th>`).join('');
    const corpo = meses.map(m => {
      const tot = valorDe(somaCels(ordem.map(b => get(m, b))));
      const celulas = ordem.map(b => {
        const v = val(m, b), vv = v || 0, mx = maxCol.get(b) || 0;
        const calor = vv && mx ? `background:color-mix(in srgb,var(--s1) ${Math.max(6, Math.round(vv / mx * 40))}%,transparent)` : '';
        return `<td class="num" data-m="${m}" data-b="${esc(b)}" style="${calor}">${fmt(v)}</td>`;
      }).join('');
      return `<tr class="${m === refM ? 'ref' : ''}"><td class="mes" data-m="${m}">${esc(rotMes(m))}${m === refM ? ' <span class="ar">referência</span>' : ''}</td>${celulas}<td class="num tot" data-m="${m}">${fmt(tot)}</td></tr>`;
    }).join('');
    const notaTotal = modoMes === 'media' ? ' <span class="nota-inline">média do período — não é a soma dos meses</span>' : '';
    const rodape = `<tr class="fim${modoMes === 'media' ? ' fim-media' : ''}"><td class="mes" data-limpar="1">Total${notaTotal}</td>${ordem.map(b => `<td class="num" data-b="${esc(b)}">${fmt(totBase.get(b))}</td>`).join('')}<td class="num tot" data-limpar="1">${fmt(totGeral)}</td></tr>`;

    const subtitulo = modoMes === 'qtd' ? esc(cfg.colQtd)
      : modoMes === 'eq' ? 'equipes (soma das equipes de cada dia)'
      : modoMes === 'media' ? `${esc(cfg.colQtd.toLowerCase())} por equipe (média)`
      : 'lançamentos';
    const notaMedia = modoMes === 'media' ? ' Sem equipe registrada naquele mês para aquela base, aparece um traço.' : '';

    const tabela = `<div class="card" id="matriz">
      <div class="card-h"><span class="card-t">Mês a mês por base</span><span class="card-s">${subtitulo} · todos os meses</span>
        <span style="margin-left:auto;display:flex;gap:6px">${btn('qtd', cfg.colQtd)}${btn('eq', 'Equipes')}${btn('media', 'Média')}${btn('lanc', 'Lançamentos')}</span></div>
      <div style="overflow:auto"><table class="mat"><thead><tr><th>Mês</th>${cabecalho}<th class="num">Total</th></tr></thead>
        <tbody>${corpo}${rodape}</tbody></table></div>
      <div class="mat-nota">Equipes = soma das equipes de cada dia (ex.: 5 equipes em 4 dias = 20).${notaMedia} Clique num valor, mês ou base para ver os lançamentos na tabela abaixo.</div>
    </div>`;

    return { tabela, chart: graficoMediaMensal(meses, ordem, get, corBase, cfg, refM, filtroBase) };
  }

  /* Gráfico de barras: um grupo por mês, uma barra por base — sempre em quantidade por equipe
     (a "Média" da tabela acima), independente de qual dos 4 modos está selecionado ali. */
function graficoMediaMensal(meses, ordem, get, corBase, cfg, refM, filtroBase) {
    /* Com uma base escolhida no filtro (acima da tabela de lançamentos), o gráfico foca só nela —
       fica bem mais fácil de ler quando há muitos meses. Sem filtro, mostra todas agrupadas. */
    const foco = filtroBase && ordem.includes(filtroBase) ? filtroBase : null;
    const basesComDado = (foco ? [foco] : ordem).filter(b => meses.some(m => get(m, b).e > 0));
    if (!basesComDado.length) {
      return `<div class="card"><div class="card-h"><span class="card-t">Produtividade média por mês</span></div>
        <div class="card-b">${vazio(foco ? `nenhuma equipe registrada ainda para ${esc(foco)}` : 'nenhuma equipe registrada ainda para calcular a média')}</div></div>`;
    }
    const valor = (m, b) => { const c = get(m, b); return c.e > 0 ? c.q / c.e : null; };
    const maxVal = Math.max(0.1, ...meses.flatMap(m => basesComDado.map(b => valor(m, b) || 0)));
    const eixoMax = maxVal * 1.15;

    const unica = basesComDado.length === 1;
    const GW = unica ? 54 : 96, GAP = unica ? 20 : 28;
    const BW = unica ? 40 : Math.max(8, Math.min(26, (GW - (basesComDado.length - 1) * 3) / basesComDado.length));
    const larguraGrupo = Math.max(GW, basesComDado.length * BW + (basesComDado.length - 1) * 3);
    const startX = 48, altura = 190, baseY = altura, passo = larguraGrupo + GAP;
    const largura = startX + meses.length * passo + 10;

    const linhasGrade = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const y = altura - f * altura;
      return `<line x1="${startX - 6}" y1="${y}" x2="${largura - 6}" y2="${y}" stroke="var(--border)" stroke-dasharray="2,3"/>
        <text x="${startX - 10}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${n1(f * eixoMax)}</text>`;
    }).join('');

    /* faixas claras alternadas atrás de cada mês, pra olho acompanhar a coluna mesmo rolando de lado */
    const zebra = meses.map((m, i) => {
      const gx = startX + i * passo;
      const cor = m === refM ? 'color-mix(in srgb,var(--accent) 14%,transparent)' : (i % 2 ? 'var(--surface-2)' : 'transparent');
      return `<rect x="${gx - GAP / 2}" y="0" width="${passo}" height="${altura}" fill="${cor}"/>`;
    }).join('');

    let x = startX;
    const grupos = meses.map(m => {
      const gx = x; x += passo;
      const barras = basesComDado.map((b, i) => {
        const v = valor(m, b);
        if (!v) return '';
        const bx = gx + i * (BW + 3), h = Math.max(1, Math.round((v / eixoMax) * altura));
        const rotulo = unica ? `<text x="${bx + BW / 2}" y="${altura - h - 5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${n1(v)}</text>` : '';
        return `<rect x="${bx}" y="${altura - h}" width="${BW}" height="${h}" rx="2" fill="${corBase.get(b) || 'var(--s1)'}"><title>${esc(b)} — ${esc(rotMes(m))}: ${n1(v)}</title></rect>${rotulo}`;
      }).join('');
      const cx = gx + larguraGrupo / 2;
      return `${barras}<text x="${cx}" y="${baseY + 12}" text-anchor="end" font-size="10" ${m === refM ? 'font-weight="700" fill="var(--ink)"' : 'fill="var(--muted)"'} transform="rotate(-35 ${cx} ${baseY + 12})">${esc(rotMes(m))}${m === refM ? ' •' : ''}</text>`;
    }).join('');

    const legenda = unica ? '' : `<div style="padding:0 13px 12px;font-size:10px;display:flex;flex-wrap:wrap">${basesComDado.map(b => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">
        <span style="width:9px;height:9px;border-radius:2px;background:${corBase.get(b) || 'var(--s1)'};display:inline-block"></span>${esc(b)}</span>`).join('')}</div>`;

    return `<div class="card">
      <div class="card-h"><span class="card-t">Produtividade média por mês</span><span class="card-s">${esc(cfg.colQtd.toLowerCase())} por equipe${foco ? ' · ' + esc(foco) : ' · uma barra por base'}</span></div>
      <div style="overflow-x:auto"><svg viewBox="0 0 ${largura} ${baseY + 46}" style="width:${Math.max(360, largura)}px;max-width:none;height:${baseY + 46}px;display:block" xmlns="http://www.w3.org/2000/svg">
        ${zebra}
        ${linhasGrade}
        <line x1="${startX - 6}" y1="${altura}" x2="${largura - 6}" y2="${altura}" stroke="var(--border-2)"/>
        ${grupos}
      </svg></div>
      ${legenda}
      <div class="mat-nota">Cada barra é a média de ${esc(cfg.colQtd.toLowerCase())} por equipe naquele mês.${foco ? ' Escolha "Todas as bases" no filtro acima da tabela para comparar todas de novo.' : ' Escolha uma base no filtro acima da tabela para ver só ela, com o gráfico bem mais largo.'}</div>
    </div>`;
  }

    /* --------------------------------------------- visão genérica "por base" */
  /* Serve tanto pra Medidores (fechamento_bases) quanto pra Blindagem
     (fechamento_producao) — as duas abas têm a mesma cara: uma linha por
     base/dia, com meta, quantidade e motivo opcional. */
  function paginaFechamento(rows, ref, filtroObj, cfg) {
    const refK = key(ref);
    const bases = [...new Set(rows.map(f => f._base))].filter(Boolean).sort();
    const corBase = new Map(bases.map((b, i) => [b, cores[i % cores.length]]));

    const d30 = addDays(ref, -29);
    const noPeriodo = rows.filter(f => f._d && f._d >= d30);
    const hoje = rows.filter(f => f._k === refK);
    const baseHoje = new Set(hoje.map(f => f._base));
    const semHoje = bases.filter(b => !baseHoje.has(b) && !encerrada(b));
    const comMotivo30 = noPeriodo.filter(f => f._motivo);
    const totalHoje = hoje.reduce((s, f) => s + f._q, 0);
    const doMes = rows.filter(f => f._d && f._d.getMonth() === ref.getMonth() && f._d.getFullYear() === ref.getFullYear());
    const totalMes = doMes.reduce((s, f) => s + f._q, 0);
    const equipesMes = doMes.reduce((s, f) => s + (f._equipes || 0), 0);
    const diasMes = new Set(doMes.map(f => f._k)).size || 1;
    const porDia = (Math.round(equipesMes / diasMes * 10) / 10).toLocaleString('pt-BR');

    let linhas = rows;
    if (filtroObj.q) { const q = norm(filtroObj.q); linhas = linhas.filter(x => norm(x.base + x.motivo + x.observacao + x.gerente).includes(q)); }
    if (filtroObj.base) linhas = linhas.filter(x => x._base === filtroObj.base);
    if (filtroObj.mes) linhas = linhas.filter(x => x._d && ym(x._d) === filtroObj.mes);
    linhas = [...linhas].sort((a, b) => {
      let x = filtroObj.ord === 'data' ? (a._d || 0) : filtroObj.ord === '_q' ? a._q : a[filtroObj.ord];
      let y = filtroObj.ord === 'data' ? (b._d || 0) : filtroObj.ord === '_q' ? b._q : b[filtroObj.ord];
      if (typeof x === 'string') { x = norm(x); y = norm(y); }
      return (x > y ? 1 : x < y ? -1 : 0) * filtroObj.dir;
    });

    const camposCsv = cfg.comProduto
      ? ['data', 'hora', 'base', 'produto', 'equipes', 'meta', 'quantidade', 'motivo', 'observacao', 'gerente']
      : ['data', 'hora', 'base', 'equipes', 'meta', 'quantidade', 'motivo', 'observacao', 'gerente'];
    EXPORTAR = {
      arquivo: cfg.arquivo + (filtroObj.base ? '-' + norm(filtroObj.base).replace(/\s+/g, '-') : '') + (filtroObj.mes ? '-' + filtroObj.mes : ''),
      cab: camposCsv, dados: linhas.map(f => camposCsv.map(c => c === 'produto' ? (f._produto || '') : (f[c] ?? ''))),
    };

    const cols = [
      { k: 'data', t: 'Data' },
      { k: 'base', t: 'Base', r: x => tag(x.base, corBase.get(x._base) || 'var(--s1)') },
      { k: 'equipes', t: 'Equipes', num: 1, r: x => n0(x._equipes) },
      { k: 'meta', t: 'Meta', num: 1, r: x => x._meta ? n0(x._meta) : '—' },
      { k: '_q', t: cfg.colQtd, num: 1, r: x => `<b>${n0(x._q)}</b>` },
      { k: 'pct', t: '% meta', num: 1, r: x => { if (!x._meta) return '—'; const v = Math.round(x._q / x._meta * 100);
          return tag(v + '%', v >= 100 ? 'var(--good)' : v >= 70 ? 'var(--warn)' : 'var(--crit)'); } },
      { k: 'motivo', t: 'Motivo', r: x => x.motivo ? tag(x.motivo, 'var(--warn)') : '—' },
      { k: 'observacao', t: 'Observação' }, { k: 'gerente', t: 'Gerente' }, { k: 'hora', t: 'Hora' },
    ];

    const meses = listaMeses(rows);
    const matrizObj = matrizMeses(rows, bases, meses, ref, cfg, corBase, filtroObj.base);

    /* cartão de barras por base: últimos 30 dias (padrão), um mês qualquer ou tudo */
    if (filtroObj.periodo !== '30d' && filtroObj.periodo !== 'tudo' && !meses.includes(filtroObj.periodo)) filtroObj.periodo = '30d';
    const refM = ym(ref);
    const rotPeriodo = filtroObj.periodo === '30d' ? 'últimos 30 dias' : filtroObj.periodo === 'tudo' ? 'todo o período' : rotMes(filtroObj.periodo);
    const rowsBarra = filtroObj.periodo === '30d' ? noPeriodo
      : filtroObj.periodo === 'tudo' ? rows
      : rows.filter(f => f._d && ym(f._d) === filtroObj.periodo);
    const porBase = bases.map(b => ({ base: b, total: rowsBarra.filter(f => f._base === b).reduce((s, f) => s + f._q, 0) }))
      .filter(p => p.total > 0 || !encerrada(p.base))
      .sort((a, b) => b.total - a.total);
    const topTotal = porBase[0]?.total || 1;
    const totalBarra = porBase.reduce((s, p) => s + p.total, 0);
    const opPeriodo = (v, txt) => `<option value="${v}" ${v === filtroObj.periodo ? 'selected' : ''}>${esc(txt)}</option>`;
    const opcoesPeriodo = opPeriodo('30d', 'Últimos 30 dias')
      + [...meses].reverse().map(m => opPeriodo(m, rotMes(m) + (m === refM ? ' (este mês)' : ''))).join('')
      + opPeriodo('tudo', 'Tudo');

    const html = !rows.length ? vazio(cfg.vazioMsg) : `
      <div class="kpis">
        <div class="card kpi"><div class="kpi-ic" style="background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)">${svg(cfg.icon, 18)}</div>
          <div><div class="kpi-l">${cfg.kpiHoje}</div><div class="kpi-v">${n0(totalHoje)}</div></div></div>
        <div class="card kpi"><div class="kpi-ic" style="background:color-mix(in srgb,${semHoje.length ? 'var(--warn)' : 'var(--good)'} 16%,transparent);color:${semHoje.length ? 'var(--warn)' : 'var(--good)'}">${svg(I.alertas, 18)}</div>
          <div><div class="kpi-l">Bases sem lançar hoje</div><div class="kpi-v">${n0(semHoje.length)}</div></div></div>
        <div class="card kpi"><div class="kpi-ic" style="background:color-mix(in srgb,var(--serious) 16%,transparent);color:var(--serious)">${svg(I.relatorios, 18)}</div>
          <div><div class="kpi-l">Justificativas (30d)</div><div class="kpi-v">${n0(comMotivo30.length)}</div></div></div>
        <div class="card kpi"><div class="kpi-ic" style="background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)">${svg(I.producao, 18)}</div>
          <div><div class="kpi-l">Total no mês</div><div class="kpi-v">${n0(totalMes)}</div></div></div>
        <div class="card kpi"><div class="kpi-ic" style="background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--s2)">${svg(I.equipes, 18)}</div>
          <div><div class="kpi-l">Equipes no mês</div><div class="kpi-v">${n0(equipesMes)}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:1px">soma dos dias · ${porDia} por dia</div></div></div>
      </div>

      ${semHoje.length ? `<div class="card warnbox"><div class="card-b">
        <span style="color:var(--warn)">${svg(I.alertas, 15)}</span><b>Ainda não fecharam hoje:</b>
        ${semHoje.map(b => tag(b, corBase.get(b) || 'var(--warn)')).join(' ')}
      </div></div>` : ''}

      <div class="card"><div class="card-h"><span class="card-t">${cfg.tituloBarra}</span><span class="card-s">${esc(rotPeriodo)} · total ${n0(totalBarra)}</span>
        <span style="margin-left:auto"><span class="field"><select id="${cfg.idPeriodoSel}">${opcoesPeriodo}</select></span></span></div>
        <div class="card-b">${porBase.map(p => `<div class="hbar">
            <span class="hbar-n">${esc(p.base)}</span><span class="hbar-v"><b>${n0(p.total)}</b></span>
            <span class="hbar-tr"><span class="hbar-fl" style="width:${topTotal ? Math.round(p.total / topTotal * 100) : 0}%;background:${corBase.get(p.base)}"></span></span></div>`).join('') || vazio('sem lançamentos no período')}
        </div></div>

      ${matrizObj.tabela}

      ${matrizObj.chart}

      ${comMotivo30.length ? `<div class="card"><div class="card-h"><span class="card-t">Justificativas recentes</span><span class="card-s">últimos 30 dias</span></div>
        <div class="card-b">${comMotivo30.sort((a, b) => (b._d || 0) - (a._d || 0)).slice(0, 12).map(j => `
          <div class="mini"><span class="mini-l">${tag(j.base, corBase.get(j._base) || 'var(--s1)')} ${esc(j.data)} — ${esc(j.motivo)}${j.observacao ? ' · ' + esc(j.observacao) : ''}</span>
          <span class="mini-v">${esc(j.gerente || '')}</span></div>`).join('')}</div></div>` : ''}

      <div class="bar">
        <div class="field">${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', 13)}<input id="${cfg.idBusca}" placeholder="Buscar base, motivo, gerente…" value="${esc(filtroObj.q)}" style="width:220px"></div>
        <div class="field"><select id="${cfg.idBaseSel}"><option value="">Todas as bases</option>${bases.map(b => `<option value="${esc(b)}" ${b === filtroObj.base ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>
        <div class="field"><select id="${cfg.idMesSel}"><option value="">Todos os meses</option>${meses.map(m => `<option value="${m}" ${m === filtroObj.mes ? 'selected' : ''}>${esc(rotMes(m))}</option>`).join('')}</select></div>
      </div>
      <div class="tbl-wrap" id="tblTopo"><table>
        <thead><tr>${cols.map(c => `<th data-k="${c.k}" class="${c.num ? 'num' : ''}">${esc(c.t)}${filtroObj.ord === c.k ? `<span class="ar">${filtroObj.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr></thead>
        <tbody>${linhas.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.r ? c.r(r) : esc(r[c.k] ?? '—')}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}">${vazio('nenhum registro encontrado')}</td></tr>`}</tbody>
      </table></div>
      <div style="font-size:10px;color:var(--muted);margin-top:6px">${n0(linhas.length)} de ${n0(rows.length)} registros · soma ${n0(linhas.reduce((s, x) => s + x._q, 0))} · equipes ${n0(linhas.reduce((s, x) => s + (x._equipes || 0), 0))}</div>
    `;

    $('#main').innerHTML = html;
    if (!rows.length) return;

    const fq = $('#' + cfg.idBusca); if (fq) fq.oninput = () => { filtroObj.q = fq.value; render(); focarFim('#' + cfg.idBusca); };
    const fb = $('#' + cfg.idBaseSel); if (fb) fb.onchange = () => { filtroObj.base = fb.value; render(); };
    const fm = $('#' + cfg.idMesSel); if (fm) fm.onchange = () => { filtroObj.mes = fm.value; render(); };
    const fpe = $('#' + cfg.idPeriodoSel); if (fpe) fpe.onchange = () => { filtroObj.periodo = fpe.value; render(); };
    document.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => { modoMes = b.dataset.modo; render(); });
    document.querySelectorAll('#matriz [data-m], #matriz [data-b], #matriz [data-limpar]').forEach(el => el.onclick = () => {
      if (el.dataset.limpar) { filtroObj.mes = ''; filtroObj.base = ''; }
      else { filtroObj.mes = el.dataset.m || ''; filtroObj.base = el.dataset.b || ''; }
      render();
      const alvo = $('#tblTopo'); if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.querySelectorAll('thead th[data-k]').forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (filtroObj.ord === k) filtroObj.dir *= -1; else { filtroObj.ord = k; filtroObj.dir = 1; }
      render();
    });
  }

  function focarFim(sel) { const n = $(sel); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }

  /* ------------------------------------------------------------ medidores */
  function renderMedidores(ref) {
    $('#pageTitle').textContent = 'Fechamento de medidores por base';
    $('#subTitle').textContent = MED.length
      ? `${MED.length} lançamento(s) na base · referência ${fmtD(ref)}`
      : 'nenhum lançamento recebido ainda';
    paginaFechamento(MED, ref, filtro, {
      icon: I.fechamento, colQtd: 'Medidores', kpiHoje: 'Medidores hoje',
      tituloBarra: 'Medidores trocados por base',
      vazioMsg: 'nenhum fechamento recebido ainda — assim que a primeira base lançar, os dados aparecem aqui automaticamente',
      idBusca: 'fq', idBaseSel: 'fbase', idMesSel: 'fmes', idPeriodoSel: 'fper', arquivo: 'medidores',
    });
  }

  /* ------------------------------------------------------------ blindagem */
  function renderProducao(ref) {
    $('#pageTitle').textContent = 'Blindagem por base';

    const produtos = [...new Set(PRO.map(p => p._produto))].filter(Boolean).sort();
    if (produtos.length && (!filtroP.produto || !produtos.includes(filtroP.produto))) {
      filtroP.produto = produtos.find(p => norm(p).includes('blindagem')) || produtos[0];
    }
    const rows = filtroP.produto ? PRO.filter(p => p._produto === filtroP.produto) : PRO;

    $('#subTitle').textContent = rows.length
      ? `${rows.length} lançamento(s) na base · referência ${fmtD(ref)}`
      : 'nenhum lançamento de produção recebido ainda';

    const seletor = produtos.length > 1
      ? `<div class="bar"><div class="field"><select id="fprod">${produtos.map(p => `<option value="${esc(p)}" ${p === filtroP.produto ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div></div>`
      : '';

    paginaFechamento(rows, ref, filtroP, {
      icon: I.producao, colQtd: 'Blindagens', kpiHoje: 'Blindagens hoje',
      tituloBarra: 'Blindagem por base',
      vazioMsg: 'nenhum lançamento de Blindagem recebido ainda',
      idBusca: 'fqp', idBaseSel: 'fbasep', idMesSel: 'fmesp', idPeriodoSel: 'fperp', arquivo: 'blindagem', comProduto: true,
    });

    if (seletor && rows.length) $('#main').insertAdjacentHTML('afterbegin', seletor);
    const fprod = $('#fprod'); if (fprod) fprod.onchange = () => { filtroP.produto = fprod.value; render(); };
  }

  /* ------------------------------------------------------------ visão geral: mês a mês (as duas frentes) */
  function geralMesAMes(ref) {
    const meses = listaMeses([...MED, ...PRO]);
    if (!meses.length) return vazio('nenhum lançamento recebido ainda');
    const agrupa = rows => {
      const m = new Map();
      rows.forEach(f => {
        if (!f._d || (baseGeral && f._base !== baseGeral)) return;
        const k = ym(f._d), c = m.get(k) || { q: 0, e: 0, n: 0 };
        c.q += f._q; c.e += f._equipes || 0; c.n += 1; m.set(k, c);
      });
      return m;
    };
    const med = agrupa(MED), pro = agrupa(PRO);
    const g = (m, k) => m.get(k) || { q: 0, e: 0, n: 0 };
    const maxMed = Math.max(1, ...meses.map(k => g(med, k).q));
    const maxPro = Math.max(1, ...meses.map(k => g(pro, k).q));
    const refM = ym(ref);
    const traco = '<span style="color:var(--muted)">—</span>';
    const barra = (v, mx, cor) => { const p = Math.round(v / mx * 100); return v ? `background:linear-gradient(90deg,color-mix(in srgb,${cor} 26%,transparent) ${p}%,transparent ${p}%)` : ''; };
    const td = (ir, m, v, estilo = '') => `<td class="num" data-ir="${ir}" data-m="${m}" style="${estilo}">${v ? n0(v) : traco}</td>`;

    const linhas = meses.map(m => {
      const a = g(med, m), b = g(pro, m);
      return `<tr class="${m === refM ? 'ref' : ''}"><td class="mes">${esc(rotMes(m))}${m === refM ? ' <span class="ar">referência</span>' : ''}</td>
        ${td('medidores', m, a.q, barra(a.q, maxMed, 'var(--s1)'))}${td('medidores', m, a.e)}${td('medidores', m, a.n)}
        ${td('producao', m, b.q, barra(b.q, maxPro, 'var(--s3)'))}${td('producao', m, b.e)}${td('producao', m, b.n)}</tr>`;
    }).join('');
    const soma = (mapa, campo) => meses.reduce((s, k) => s + g(mapa, k)[campo], 0);
    const fim = `<tr class="fim"><td class="mes">Total</td>
        ${td('medidores', '', soma(med, 'q'))}${td('medidores', '', soma(med, 'e'))}${td('medidores', '', soma(med, 'n'))}
        ${td('producao', '', soma(pro, 'q'))}${td('producao', '', soma(pro, 'e'))}${td('producao', '', soma(pro, 'n'))}</tr>`;

    EXPORTAR = {
      arquivo: 'visao-geral-mes-a-mes' + (baseGeral ? '-' + norm(baseGeral).replace(/\s+/g, '-') : ''),
      cab: ['mes', 'medidores_trocados', 'medidores_equipes', 'medidores_lancamentos', 'blindagens', 'blindagens_equipes', 'blindagens_lancamentos'],
      dados: [...meses.map(m => { const a = g(med, m), b = g(pro, m); return [m, a.q, a.e, a.n, b.q, b.e, b.n]; }),
        ['total', soma(med, 'q'), soma(med, 'e'), soma(med, 'n'), soma(pro, 'q'), soma(pro, 'e'), soma(pro, 'n')]],
    };

    return `<div class="card" id="geralMeses">
      <div class="card-h"><span class="card-t">Mês a mês</span><span class="card-s">${baseGeral ? esc(baseGeral) : 'todas as bases'} · Medidores e Blindagem</span></div>
      <div style="overflow:auto"><table class="mat">
        <thead><tr><th></th><th class="grp" colspan="3">📟 Medidores</th><th class="grp" colspan="3">📦 Blindagem</th></tr>
          <tr><th>Mês</th><th class="num">Trocados</th><th class="num">Equipes</th><th class="num">Lanç.</th><th class="num">Blindagens</th><th class="num">Equipes</th><th class="num">Lanç.</th></tr></thead>
        <tbody>${linhas}${fim}</tbody></table></div>
      <div class="mat-nota">Equipes = soma das equipes de cada dia · Lanç. = número de lançamentos. Clique num valor para abrir o detalhe daquele mês na aba da frente.</div>
    </div>`;
  }

  /* ------------------------------------------------------------ visão geral (as duas juntas) */
  function renderGeral(ref) {
    $('#pageTitle').textContent = 'Visão geral';
    $('#subTitle').textContent = `Medidores e Blindagem lado a lado · referência ${fmtD(ref)}`;

    const refK = key(ref);
    const bases = [...new Set(MED.map(f => f._base))].filter(Boolean);
    const hojeMed = MED.filter(f => f._k === refK);
    const baseHojeMed = new Set(hojeMed.map(f => f._base));
    const semHojeMed = bases.filter(b => !baseHojeMed.has(b) && !encerrada(b));
    const totalHojeMed = hojeMed.reduce((s, f) => s + f._q, 0);
    const comMetaMed = hojeMed.filter(f => f._meta);
    const pctMedioMed = comMetaMed.length ? Math.round(comMetaMed.reduce((s, f) => s + f._q / f._meta, 0) / comMetaMed.length * 100) : null;

    const basesProd = [...new Set(PRO.map(p => p._base))].filter(Boolean);
    const hojeProd = PRO.filter(p => p._k === refK);
    const baseHojeProd = new Set(hojeProd.map(p => p._base));
    const semHojeProd = basesProd.filter(b => !baseHojeProd.has(b) && !encerrada(b));
    const totalHojeProd = hojeProd.reduce((s, p) => s + p._q, 0);
    const comMetaProd = hojeProd.filter(p => p._meta);
    const pctMedioProd = comMetaProd.length ? Math.round(comMetaProd.reduce((s, p) => s + p._q / p._meta, 0) / comMetaProd.length * 100) : null;

    const linha = (l, v) => `<div class="mini"><span class="mini-l">${esc(l)}</span><span class="mini-v" style="font-weight:700;color:var(--ink)">${v}</span></div>`;

    const cartoesHoje = `
      <div class="duas">
        <div class="card">
          <div class="card-b">
            <h2>${svg(I.fechamento, 16)} Medidores</h2>
            ${linha('Medidores hoje', n0(totalHojeMed))}
            ${linha('Bases sem lançar hoje', semHojeMed.length ? tag(n0(semHojeMed.length), 'var(--warn)') : tag('0', 'var(--good)'))}
            ${linha('% médio da meta hoje', pctMedioMed == null ? '—' : (pctMedioMed + '%'))}
            ${linha('Bases cadastradas', n0(bases.filter(b => !encerrada(b)).length))}
          </div>
        </div>
        <div class="card">
          <div class="card-b">
            <h2>${svg(I.producao, 16)} Blindagem</h2>
            ${linha('Blindagens hoje', n0(totalHojeProd))}
            ${linha('Bases sem lançar hoje', semHojeProd.length ? tag(n0(semHojeProd.length), 'var(--warn)') : tag('0', 'var(--good)'))}
            ${linha('% médio da meta hoje', pctMedioProd == null ? '—' : (pctMedioProd + '%'))}
            ${linha('Bases cadastradas', n0(basesProd.filter(b => !encerrada(b)).length))}
          </div>
        </div>
      </div>
      <div class="footnote" style="margin-top:2px">Use as abas acima para ver o detalhe de cada frente.</div>
    `;

    const todasBases = [...new Set([...MED, ...PRO].map(f => f._base))].filter(Boolean).sort();
    const chave = (id, txt) => `<button class="btn seg ${modoGeral === id ? 'on' : ''}" data-geral="${id}">${txt}</button>`;
    const topo = `<div class="bar" style="align-items:center;gap:10px">
        <span style="display:flex;gap:6px">${chave('hoje', 'Hoje')}${chave('mes', 'Mês a mês')}</span>
        ${modoGeral === 'mes' ? `<div class="field"><select id="gbase"><option value="">Todas as bases</option>${todasBases.map(b => `<option value="${esc(b)}" ${b === baseGeral ? 'selected' : ''}>${esc(b)}${encerrada(b) ? ' (encerrada)' : ''}</option>`).join('')}</select></div>` : ''}
      </div>`;

    if (modoGeral === 'mes') $('#subTitle').textContent = 'Mês a mês · Medidores e Blindagem · referência ' + fmtD(ref);
    $('#main').innerHTML = topo + (modoGeral === 'mes' ? geralMesAMes(ref) : cartoesHoje);

    document.querySelectorAll('[data-geral]').forEach(b => b.onclick = () => { modoGeral = b.dataset.geral; render(); });
    const gb = $('#gbase'); if (gb) gb.onchange = () => { baseGeral = gb.value; render(); };
    document.querySelectorAll('#geralMeses [data-ir]').forEach(el => el.onclick = () => {
      const alvo = el.dataset.ir === 'medidores' ? filtro : filtroP;
      alvo.mes = el.dataset.m || ''; alvo.base = baseGeral || '';
      ABA_ATIVA = el.dataset.ir; render();
      const t = $('#tblTopo'); if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function render() {
    carregar();
    EXPORTAR = null;
    const ref = refGeral();
    $('#topDate').textContent = fmtD(ref);

    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.t === ABA_ATIVA));

    if (ABA_ATIVA === 'medidores') renderMedidores(ref);
    else if (ABA_ATIVA === 'producao') renderProducao(ref);
    else renderGeral(ref);

    renderAvisoImport();
    $('#btnExport').disabled = !EXPORTAR;
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    ABA_ATIVA = t.dataset.t;
    render();
  }));

  /* ------------------------------------------------------------ atualização automática */
  /* A cada 10 s a página abre uma cópia escondida de si mesma, lê os dados que estão no arquivo agora e,
     se mudaram, troca e redesenha — sem recarregar, então a aba, os filtros e o que foi importado ficam. */
  let ultimaAcao = 0, sonda = null, pendente = null;
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => { ultimaAcao = Date.now(); }, { passive: true }));
  const mexendo = () => Date.now() - ultimaAcao < 8000 || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '');

  function marcarAtualizado(mod) {
    const d = new Date(mod), z = n => String(n).padStart(2, '0');
    $('#topAtual').textContent = isNaN(d) ? '' : `atualizado ${z(d.getDate())}/${z(d.getMonth() + 1)} ${z(d.getHours())}:${z(d.getMinutes())}`;
  }
  function aplicarPendente(forcar) {
    if (!pendente || (!forcar && mexendo())) return;                     // quem está mexendo não é interrompido: espera o próximo ciclo
    const m = pendente; pendente = null;
    $('#dados-embutidos').textContent = m.dados;
    render(); if (m.mod) marcarAtualizado(m.mod);
  }
  function pedirDados() {
    if (document.hidden || sonda) return;                   // aba escondida, ou já há uma conferência em andamento
    sonda = document.createElement('iframe');
    sonda.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
    sonda.dataset.codigo = Date.now() + '-' + Math.random().toString(36).slice(2);
    sonda.src = location.href.split('#')[0].split('?')[0] + '?chk=1&t=' + sonda.dataset.codigo;
    document.body.appendChild(sonda);
    const minha = sonda;
    setTimeout(() => { if (sonda === minha) { sonda.remove(); sonda = null; } }, 15000);   // não respondeu: tenta no próximo ciclo
  }
  addEventListener('message', e => {
    const m = e.data;
    if (!sonda || !m || m.tipo !== 'dados-ceo' || m.t !== sonda.dataset.codigo) return;   // só a resposta da conferência em andamento
    sonda.remove(); sonda = null;
    try { JSON.parse(m.dados); } catch (err) { return; }    // arquivo ainda sendo gravado: espera o próximo ciclo
    if (String(m.dados).trim() !== $('#dados-embutidos').textContent.trim()) pendente = m;
    aplicarPendente();
  });
  /* ---- fonte online: o painel pergunta à planilha (via Apps Script) se mudou algo e, se mudou, busca de novo.
     Vale em qualquer computador ou celular; nada depende do PC do bot estar ligado. */
  const API = (window.CEO_API && window.CEO_API.url && window.CEO_API.token) ? window.CEO_API : null;
  if (API) {
    let versaoApi = null, ultimaCargaApi = 0, buscando = false, ultimoOk = 0, erroApi = '', ja_carregou = false;
    const inicioPagina = Date.now();
    const INTERVALO_API = Math.max(2, +API.intervalo || 8) * 1000;      // segundos entre conferências
    const RECARGA_API = 60000;                                          // de tempos em tempos busca tudo, mesmo sem aviso (pega edição no meio da planilha)

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const nome = '_ceo' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const s = document.createElement('script');
        const limpar = () => { clearTimeout(t); delete window[nome]; s.remove(); };
        const t = setTimeout(() => { limpar(); reject(new Error('tempo esgotado')); }, 20000);
        window[nome] = d => { limpar(); resolve(d); };
        s.onerror = () => { limpar(); reject(new Error('falha de rede')); };
        s.src = url + '&callback=' + nome;
        document.head.appendChild(s);
      });
    }
    async function chamarApi(acao) {
      const url = `${API.url}${API.url.includes('?') ? '&' : '?'}acao=${acao}&k=${encodeURIComponent(API.token)}&_=${Date.now()}`;
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error('http ' + r.status);
        return await r.json();
      } catch (e) { return await jsonp(url); }                          // se o navegador barrar o fetch, tenta por JSONP
    }
    function marcarConexao(ok) {
      const z = n => String(n).padStart(2, '0'), d = new Date(ultimoOk || Date.now());
      const hora = `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
      $('#topAtual').innerHTML = ok
        ? `<span style="color:#22a06b">●</span> ao vivo · ${hora}`
        : `<span style="color:var(--crit)">●</span> ${erroApi === 'acesso negado' ? 'senha do painel não confere' : 'sem conexão'}${ultimoOk ? ' · dados de ' + hora : ''}`;
    }
    async function conferirApi(forcar) {
      if (buscando || (document.hidden && !forcar)) return;
      buscando = true;
      try {
        const v = await chamarApi('versao');
        if (v.erro) throw new Error(v.erro);
        if (forcar || v.v !== versaoApi || Date.now() - ultimaCargaApi > RECARGA_API) {
          const d = await chamarApi('dados');
          if (d.erro) throw new Error(d.erro);
          versaoApi = d.v; ultimaCargaApi = Date.now();
          const bloco = JSON.stringify({ fechamento_bases: d.fechamento_bases || '', fechamento_producao: d.fechamento_producao || '' });
          if (bloco !== $('#dados-embutidos').textContent.trim()) { pendente = { dados: bloco }; aplicarPendente(!ja_carregou); }
          ja_carregou = true;
        }
        ultimoOk = Date.now(); erroApi = ''; marcarConexao(true);
      } catch (e) { erroApi = String((e && e.message) || e); marcarConexao(false); }
      finally { buscando = false; }
    }
    $('#topAtual').textContent = 'conectando…';
    const ciclo = () => {
      aplicarPendente(); conferirApi(false);
      setTimeout(ciclo, Date.now() - Math.max(ultimaAcao, inicioPagina) > 600000 ? Math.max(20000, INTERVALO_API) : INTERVALO_API);   // tela parada há 10 min: confere mais devagar
    };
    setTimeout(ciclo, INTERVALO_API);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) conferirApi(true); });
    conferirApi(true);
  } else {
    setInterval(() => { aplicarPendente(); pedirDados(); }, 10000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) pedirDados(); });
    marcarAtualizado(document.lastModified);
  }

  $('#btnImport').onclick = () => $('#filePick').click();
  $('#filePick').onchange = e => { importarArquivos(e.target.files); e.target.value = ''; };
  $('#btnExport').onclick = baixarVista;
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) importarArquivos(e.dataTransfer.files); });

  render();
})();
</script>
</body>
</html>
